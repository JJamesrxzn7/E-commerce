<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora productos deportivos por categoría en Apex Sports.">
  <title>Explorar categoría | Apex Sports</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-catalog-page="category">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <header class="encabezado">
    <div class="barra-superior barra-con-busqueda">
      <a class="marca" href="index.html" aria-label="Apex Sports, inicio"><span class="marca-icono" aria-hidden="true">A</span><span>APEX <strong>SPORTS</strong></span></a>
      <form class="busqueda" action="index.html" method="get" role="search">
        <label class="solo-lectores" for="buscar">Buscar productos deportivos</label>
        <input id="buscar" type="search" name="q" placeholder="Busca tu próximo entrenamiento">
        <button type="submit">Buscar</button>
      </form>
      <a class="enlace-carrito" href="carrito.html" aria-label="Ver carrito, 0 artículos"><span aria-hidden="true">♧</span><span class="texto-carrito">Carrito</span><span class="contador">0</span></a>
      <a class="enlace-favoritos" href="favoritos.html" aria-label="Ver favoritos, 0 artículos"><span aria-hidden="true">♡</span><span class="texto-favoritos">Favoritos</span><span class="contador contador-favoritos">0</span></a>
      <div class="acciones-usuario">
        <button class="boton boton-sesion" type="button" data-open-auth="login">Iniciar sesión</button>
        <button class="boton boton-outline" type="button" data-open-auth="register">Registrarse</button>
        <span class="cuenta-activa" id="cuenta-activa" hidden></span>
        <button class="boton boton-outline boton-salir" id="cerrar-sesion" type="button" hidden>Cerrar sesión</button>
      </div>
      <span class="solo-lectores" id="cart-status" role="status" aria-live="polite"></span>
      <span class="solo-lectores" id="estado-favoritos-global" role="status" aria-live="polite"></span>
      <span class="solo-lectores" id="session-status" role="status" aria-live="polite"></span>
    </div>
  </header>
  <nav class="navegacion" aria-label="Categorías principales">
    <a href="categoria.html?id=futbol">Fútbol</a><a href="categoria.html?id=basketball">Basketball</a>
    <a href="categoria.html?id=tennis">Tennis</a><a href="categoria.html?id=mma">Artes marciales</a>
  </nav>
  <main id="contenido" class="pagina-catalogo">
    <section class="seccion-catalogo">
      <div class="titulo-seccion">
        <div><p class="sobrelinea">EQUÍPATE PARA TU DEPORTE</p><h1 id="titulo-categoria">Categoría</h1></div>
        <a class="enlace-texto" href="index.html#productos">← Volver a categorías</a>
      </div>
      <p class="estado-pagina" id="catalog-status" role="status" aria-live="polite">Cargando productos…</p>
      <div class="productos" id="category-products" aria-labelledby="titulo-categoria"></div>
      <div class="favoritos-vacios" id="category-empty" hidden><p>No hay productos disponibles en esta categoría.</p><a class="boton" href="index.html#productos">Explorar otras categorías</a></div>
    </section>
  </main>
  <footer class="pie pie-simple"><p>© 2026 Apex Sports</p><a href="index.html">Volver a la tienda</a></footer>
  <script src="api-config.js" defer></script>
  <script src="api-client.js" defer></script>
  <script src="catalogo-compartido.js" defer></script>
  <script src="carrito.js" defer></script>
  <script src="auth-modal.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="catalogo-paginas.js" defer></script>
</body>
</html>
