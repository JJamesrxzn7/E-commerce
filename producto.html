<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta los detalles de un producto deportivo Apex Sports.">
  <title>Detalle de producto | Apex Sports</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-catalog-page="product">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <header class="encabezado">
    <div class="barra-superior barra-con-busqueda">
      <a class="marca" href="index.html" aria-label="Apex Sports, inicio"><span class="marca-icono" aria-hidden="true">A</span><span>APEX <strong>SPORTS</strong></span></a>
      <form class="busqueda" action="index.html" method="get" role="search">
        <label class="solo-lectores" for="buscar">Buscar productos deportivos</label>
        <input id="buscar" type="search" name="q" placeholder="Busca tu próximo entrenamiento">
        <button type="submit">Buscar</button>
      </form>
      <a class="enlace-carrito" href="carrito.html" aria-label="Ver carrito, 0 artículos"><span aria-hidden="true">♧</span><span class="texto-carrito">Carrito</span><span class="contador">0</span></a>
      <a class="enlace-favoritos" href="favoritos.html" aria-label="Ver favoritos, 0 artículos"><span aria-hidden="true">♡</span><span class="texto-favoritos">Favoritos</span><span class="contador contador-favoritos">0</span></a>
      <div class="acciones-usuario">
        <button class="boton boton-sesion" type="button" data-open-auth="login">Iniciar sesión</button>
        <button class="boton boton-outline" type="button" data-open-auth="register">Registrarse</button>
        <span class="cuenta-activa" id="cuenta-activa" hidden></span>
        <button class="boton boton-outline boton-salir" id="cerrar-sesion" type="button" hidden>Cerrar sesión</button>
      </div>
      <span class="solo-lectores" id="cart-status" role="status" aria-live="polite"></span>
      <span class="solo-lectores" id="estado-favoritos-global" role="status" aria-live="polite"></span>
      <span class="solo-lectores" id="session-status" role="status" aria-live="polite"></span>
    </div>
  </header>
  <nav class="navegacion" aria-label="Categorías principales">
    <a href="categoria.html?id=futbol">Fútbol</a><a href="categoria.html?id=basketball">Basketball</a>
    <a href="categoria.html?id=tennis">Tennis</a><a href="categoria.html?id=mma">Artes marciales</a>
  </nav>
  <main id="contenido">
    <p class="estado-pagina" id="product-status" role="status" aria-live="polite">Cargando producto…</p>
    <section class="detalle-producto" id="product-detail" aria-labelledby="product-name" hidden>
      <a class="enlace-texto detalle-volver" id="product-back" href="index.html#productos">← Volver a categorías</a>
      <div class="detalle-principal">
        <div class="detalle-galeria">
          <div class="detalle-imagen-marco"><img class="detalle-imagen" id="product-image" src="" alt="" width="360" height="300"></div>
          <div class="detalle-miniaturas" id="product-thumbnails" role="group" aria-label="Imágenes del producto" hidden></div>
        </div>
        <div class="detalle-informacion" id="product-card">
          <p class="producto-categoria" id="product-category"></p>
          <h1 id="product-name"></h1>
          <p class="precio" id="product-price"></p>
          <h2>Descripción</h2>
          <p class="detalle-descripcion" id="product-description"></p>
          <div class="selector-cantidad">
            <label for="product-quantity">Cantidad</label>
            <div class="controles-cantidad">
              <button class="boton-cantidad" id="quantity-decrease" type="button" aria-label="Reducir cantidad">−</button>
              <input id="product-quantity" type="number" inputmode="numeric" min="1" max="99" value="1" aria-describedby="quantity-help">
              <button class="boton-cantidad" id="quantity-increase" type="button" aria-label="Aumentar cantidad">+</button>
            </div>
            <small id="quantity-help">Elige de 1 a 99 unidades.</small>
          </div>
          <div class="producto-acciones producto-detalle-acciones">
            <button class="boton boton-ancho" id="product-add" type="button" data-add-product>Añadir al carrito</button>
            <button class="boton-favorito" id="product-favorite" type="button" aria-label="Agregar a favoritos" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.7Z"></path></svg>
            </button>
          </div>
          <p class="estado-detalle" id="product-feedback" role="status" aria-live="polite"></p>
        </div>
      </div>
      <section class="productos-relacionados" aria-labelledby="related-title">
        <div class="titulo-seccion"><div><p class="sobrelinea">TAMBIÉN TE PUEDE INTERESAR</p><h2 id="related-title">Más productos</h2></div></div>
        <div class="productos relacionados-grid" id="related-products"></div>
      </section>
    </section>
  </main>
  <footer class="pie pie-simple"><p>© 2026 Apex Sports</p><a href="index.html">Volver a la tienda</a></footer>
  <script src="api-config.js" defer></script>
  <script src="api-client.js" defer></script>
  <script src="catalogo-compartido.js" defer></script>
  <script src="carrito.js" defer></script>
  <script src="auth-modal.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="catalogo-paginas.js" defer></script>
</body>
</html>
